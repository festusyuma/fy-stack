name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Set package versions from release tag
        run: bunx nx release version "${TAG_NAME#v}" --git-commit=false --git-tag=false
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Build packages
        run: bunx nx run-many -t build

      - name: Publish to npm
        run: npm publish --access public --workspaces
